<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Athlete OS — アスリート化計画</title>
<meta name="description" content="週末バレーボールのための、コンディション起点のトレーニング記録">
<meta name="theme-color" content="#F3F6FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Athlete OS">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar"></header>
  <main class="screen" id="screen" tabindex="-1"></main>
  <nav class="nav" id="nav" aria-label="メインナビゲーション"></nav>

  <div class="sheet-overlay" id="sheetOverlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <button class="sheet-handle" id="sheetHandle" aria-label="閉じる"></button>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden aria-live="polite"></div>
</div>

<!-- core -->
<script src="js/core/dom.js"></script>
<script src="js/core/dates.js"></script>
<script src="js/core/db.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/sheet.js"></script>
<script src="js/core/router.js"></script>

<!-- domain -->
<script src="js/domain/condition.js"></script>
<script src="js/domain/workouts.js"></script>
<script src="js/domain/plan.js"></script>
<script src="js/domain/nutrition.js"></script>
<script src="js/domain/sessions.js"></script>
<script src="js/domain/stats.js"></script>

<!-- ui -->
<script src="js/ui/icons.js"></script>
<script src="js/ui/widgets.js"></script>
<script src="js/ui/chart.js"></script>

<!-- screens -->
<script src="js/screens/home.js"></script>
<script src="js/screens/training.js"></script>
<script src="js/screens/body.js"></script>
<script src="js/screens/food.js"></script>
<script src="js/screens/review.js"></script>
<script src="js/screens/workout-editor.js"></script>
<script src="js/screens/settings.js"></script>

<script src="js/app.js"></script>
</body>
</html>
